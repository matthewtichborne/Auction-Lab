[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "auctionlab"
version = "0.1.0"
dependencies = [
    "matplotlib>=3.8",
    "openai>=1.0.0",
    "ortools>=9.7",
    "pydantic>=2.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
pythonpath = ["src", "."]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
norecursedirs = ["legacy"]
